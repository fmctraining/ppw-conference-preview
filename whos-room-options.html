<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In the room 2026 — 7 treatments</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0e17;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.16);--ink:#eef2fb;--dim:#c7d2e6;--faint:#7c8bab;--cyan:#87dffa;
    --grad:linear-gradient(100deg in oklch,oklch(86% .10 225),oklch(80% .12 288))}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Poppins",sans-serif;line-height:1.5}
  .top{max-width:1080px;margin:0 auto;padding:44px 22px 4px}
  h1{font-size:26px;font-weight:800;margin:0 0 6px}
  .top p{color:var(--faint);font-size:14px;margin:0;max-width:900px;line-height:1.6}
  .grp{max-width:1080px;margin:44px auto 0;padding:0 22px}
  .lbl{display:inline-block;background:var(--cyan);color:#04121a;font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.4px;padding:7px 16px;border-radius:10px;margin-bottom:6px}
  .demo{border:1px solid var(--line);border-radius:20px;padding:52px 34px;margin-top:14px;background:linear-gradient(160deg,#111a2c,#0b1220);overflow:hidden}
  .eyebrow{display:inline-block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:18.5px;letter-spacing:1.8px;text-transform:uppercase;font-weight:700;text-align:center;width:100%;margin-bottom:26px}
  .more{color:#ecc6c6;font-size:14px;font-weight:600;text-align:center;margin:22px 0 0;letter-spacing:.3px}
  /* 1 flow */
  .t1 .flow{color:#dbe3f4;font-size:18px;font-weight:500;line-height:1.9;letter-spacing:.4px;text-align:center;text-wrap:balance;max-width:860px;margin:0 auto}
  .t1 .flow b{color:#fff;font-weight:600}
  .t1 .flow .sep{color:var(--cyan);opacity:.6;margin:0 8px}
  /* 2 pills */
  .t2 .pills{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:900px;margin:0 auto}
  .t2 .pill{background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:999px;padding:9px 18px;font-size:14.5px;color:#e7edfb;font-weight:600}
  /* 3 category columns */
  .t3 .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 24px;max-width:960px;margin:0 auto;text-align:center}
  @media(max-width:760px){.t3 .cols{grid-template-columns:1fr 1fr}}
  .t3 h4{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;margin:0 0 12px}
  .t3 ul{list-style:none;margin:0;padding:0}.t3 li{color:#d3dcf0;font-size:14.5px;line-height:1.85;font-weight:500}
  /* 4 category cards */
  .t4 .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:980px;margin:0 auto}
  @media(max-width:760px){.t4 .cards{grid-template-columns:1fr 1fr}}
  .t4 .card{background:rgba(18,27,47,.6);border:1px solid var(--line2);border-radius:14px;padding:20px 20px 22px}
  .t4 .card h4{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--cyan);font-weight:800;margin:0 0 11px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .t4 .card div{color:#d3dcf0;font-size:14px;line-height:1.8}
  /* 5 marquee */
  .t5 .mq{overflow:hidden;position:relative;margin:0 -34px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
  .t5 .row{display:flex;gap:0;width:max-content;animation:scroll 34s linear infinite}
  .t5 .row.r2{animation-duration:40s;animation-direction:reverse;margin-top:14px}
  .t5 .row span{white-space:nowrap;color:#dbe3f4;font-size:19px;font-weight:600;padding:0 26px}
  .t5 .row span::after{content:"•";color:var(--cyan);opacity:.5;margin-left:52px}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  /* 6 two columns categorized */
  .t6 .two{display:grid;grid-template-columns:1fr 1fr;gap:14px 46px;max-width:840px;margin:0 auto}
  @media(max-width:640px){.t6 .two{grid-template-columns:1fr}}
  .t6 .rowc{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  .t6 .rc-cat{flex:none;width:96px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:800;text-align:right;line-height:1.3}
  .t6 .rc-orgs{color:#d3dcf0;font-size:14px;font-weight:500;line-height:1.55}
  /* 7 grouped bands */
  .t7 .band2{display:flex;align-items:center;gap:18px;max-width:900px;margin:0 auto;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)}
  .t7 .band2:last-of-type{border-bottom:0}
  .t7 .b-cat{flex:none;width:150px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .t7 .b-orgs{color:#dbe3f4;font-size:15px;font-weight:500}
  @media(max-width:640px){.t7 .band2{flex-direction:column;align-items:flex-start;gap:5px}.t7 .b-cat{width:auto}}
  .foot{max-width:1080px;margin:0 auto;padding:44px 22px 90px;color:var(--faint);font-size:12.5px}
</style>
</head>
<body>
<header class="top">
  <h1>"In the room in 2026" — 7 treatments</h1>
  <p>Same 30 organizations, seven ways to present them. All on the dark section. Reply 1–7 (mix welcome, e.g. "3 but centered like 1").</p>
</header>
<div id="root"></div>
<p class="foot">Internal preview — whos-room-options.html · reply 1 / 2 / 3 / 4 / 5 / 6 / 7</p>

<script>
const CATS=[
 ["Streaming & Studios",["Netflix","Amazon MGM Studios","Disney+","Warner Bros. Discovery","Paramount+"]],
 ["Broadcast Networks",["NBC Universal","CBS News","ABC News","ESPN","BBC Studios"]],
 ["Post Production",["Technicolor","Industrial Light & Magic","Framestore","MPC","Company 3"]],
 ["News & Sports",["Associated Press","Reuters","Bloomberg","Fox Sports","NFL Films"]],
 ["Enterprise & Corporate",["Apple","Google","Microsoft","Meta","Sony Pictures"]],
 ["Government & Education",["NASA","US Air Force","NYU Tisch","USC Cinematic Arts","Pixar"]],
];
const FLAT=CATS.flatMap(c=>c[1]);
const EB='<div class="eyebrow">In the room in 2026</div>';
const MORE='<p class="more">and hundreds more</p>';
function sec(n,label,inner){return `<div class="grp t${n}"><span class="lbl">${n}</span><div class="demo">${EB}${inner}${MORE}</div></div>`;}
let H='';
// 1 flow
H+=sec(1,'flow',`<div class="flow">${FLAT.map(o=>`<b>${o}</b>`).join('<span class="sep">·</span>')}</div>`);
// 2 pills
H+=sec(2,'pills',`<div class="pills">${FLAT.map(o=>`<span class="pill">${o}</span>`).join('')}</div>`);
// 3 category columns
H+=sec(3,'cols',`<div class="cols">${CATS.map(c=>`<div><h4>${c[0]}</h4><ul>${c[1].map(o=>`<li>${o}</li>`).join('')}</ul></div>`).join('')}</div>`);
// 4 category cards
H+=sec(4,'cards',`<div class="cards">${CATS.map(c=>`<div class="card"><h4>${c[0]}</h4><div>${c[1].join('<br>')}</div></div>`).join('')}</div>`);
// 5 marquee (duplicate for seamless loop)
const half=FLAT.slice(0,15), half2=FLAT.slice(15);
const mrow=arr=>`<div class="row">${[...arr,...arr].map(o=>`<span>${o}</span>`).join('')}</div>`;
H+=sec(5,'marquee',`<div class="mq">${mrow(half)}${mrow(half2).replace('class="row"','class="row r2"')}</div>`);
// 6 two-column categorized
H+=sec(6,'two',`<div class="two">${CATS.map(c=>`<div class="rowc"><div class="rc-cat">${c[0]}</div><div class="rc-orgs">${c[1].join(', ')}</div></div>`).join('')}</div>`);
// 7 grouped bands
H+=sec(7,'bands',`<div>${CATS.map(c=>`<div class="band2"><div class="b-cat">${c[0]}</div><div class="b-orgs">${c[1].join('  ·  ')}</div></div>`).join('')}</div>`);
document.getElementById('root').innerHTML=H;
</script>
</body>
</html>
