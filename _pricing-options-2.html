<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPW NY — Registration · 6 more designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e17;--bg-2:#0f1626;--panel:#131c30;--panel-2:#18223a;--line:#243150;--line-2:#2c3a5c;--ink:#eaf0ff;--ink-dim:#9fb0d4;--ink-faint:#6c7c9e;--accent:#3b82f6;--accent-2:#22d3ee;--gold:#f5c451;
 --t-post:#a78bfa;--t-craft:#2dd4bf;--t-ai:#60a5fa;--t-immersive:#f472b6;--t-creator:#fb923c;--t-corp:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
.psec{position:relative;padding:78px 30px 84px;border-bottom:1px solid rgba(255,255,255,.05)}
.psec::before{content:"";position:absolute;top:0;left:0;right:0;height:300px;background:radial-gradient(640px 220px at 50% 0,rgba(99,102,241,.10),transparent 72%);pointer-events:none}
.wrap{max-width:1040px;margin:0 auto;position:relative}
.vlabel{font-family:"Space Grotesk",monospace;font-size:12.5px;letter-spacing:2px;text-transform:uppercase;margin:0 0 30px;display:flex;align-items:center;gap:12px}
.vlabel .n{color:var(--accent-2);font-weight:700}.vlabel .nm{color:var(--ink-faint);text-transform:none;letter-spacing:.3px}
.vlabel::before{content:"";width:26px;height:26px;border:1px solid var(--line-2);border-radius:7px}
.shead{text-align:center;max-width:680px;margin:0 auto 34px}
.eyebrow{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;background:linear-gradient(100deg in oklch,oklch(86% .10 225),oklch(80% .12 288));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;margin:0 0 14px}
.stitle{font-size:clamp(28px,4vw,38px);margin:0;font-weight:700;letter-spacing:-.6px;background:linear-gradient(180deg,#fff,#c9d5ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.sdesc{color:var(--ink-dim);max-width:600px;margin:14px auto 0;font-size:15.5px;line-height:1.6}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(180deg,#6ba6ff,#4a82e6);color:#fff;font-weight:700;font-size:14.5px;letter-spacing:.2px;padding:15px 26px;border-radius:999px;text-decoration:none;box-shadow:0 10px 26px rgba(74,130,230,.4);border:0;cursor:pointer}
.cta.full{display:flex;width:100%}
.cta::after{content:"→"}
.chk{flex:none;width:21px;height:21px;border-radius:50%;background:linear-gradient(150deg,#6ba6ff,#4a82e6);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(74,130,230,.35)}

/* ===== V8 · Boarding pass II ===== */
.v8{max-width:900px;margin:0 auto;background:var(--panel);border:1px solid var(--line-2);border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.45)}
.v8 .bar{height:4px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.v8 .in{display:flex}
.v8 .stub{flex:0 0 33%;background:linear-gradient(180deg,#17233e,#0f1930);padding:40px 26px;text-align:center;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center}
.v8 .stub::after{content:"";position:absolute;top:16px;bottom:16px;right:0;width:1px;border-right:2px dashed var(--line-2)}
.v8 .rail{font-family:"Space Grotesk";font-size:10px;letter-spacing:4px;color:var(--ink-faint);text-transform:uppercase;margin-bottom:16px}
.v8 .big{font-family:"Poppins";font-weight:800;font-size:58px;line-height:1;color:#fff;letter-spacing:-2px}
.v8 .big sup{font-size:24px;vertical-align:super;color:var(--accent-2)}
.v8 .psub{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-faint);margin:10px 0 18px}
.v8 .rate{font-size:12.5px;color:var(--ink-dim);margin:3px 0}.v8 .rate b{color:#fff}
.v8 .notch{position:absolute;left:calc(33% - 11px);width:22px;height:22px;border-radius:50%;background:var(--bg);z-index:3}
.v8 .body{flex:1;padding:38px 40px}
.v8 .pname{font-weight:800;font-size:15px;letter-spacing:.5px;text-transform:uppercase;color:var(--accent-2);margin:0 0 20px}
.v8 li{list-style:none;display:flex;gap:12px;align-items:flex-start;margin:0 0 15px;font-size:13.5px;color:var(--ink-dim);line-height:1.5}
.v8 li b{display:block;color:#fff;font-weight:700;margin-bottom:1px}
.v8 ul{margin:0 0 24px;padding:0}

/* ===== V9 · Spotlight split ===== */
.v9{display:grid;grid-template-columns:.9fr 1.1fr;max-width:940px;margin:0 auto;border-radius:20px;overflow:hidden;border:1px solid rgba(120,160,255,.24);box-shadow:0 34px 80px rgba(0,0,0,.5)}
.v9 .buy{position:relative;padding:46px 38px;text-align:center;background:linear-gradient(170deg,#1b2c4d,#0e1830);display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.v9 .buy::before{content:"";position:absolute;top:-30%;left:50%;transform:translateX(-50%);width:360px;height:360px;background:radial-gradient(circle,rgba(34,211,238,.3),transparent 62%)}
.v9 .buy>*{position:relative}
.v9 .pname{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent-2);margin:0 0 12px;font-weight:700}
.v9 .big{font-family:"Poppins";font-weight:800;font-size:66px;line-height:1;color:#fff;letter-spacing:-2px;text-shadow:0 0 34px rgba(34,211,238,.45)}
.v9 .big sup{font-size:28px;vertical-align:super}
.v9 .psub{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-dim);margin:10px 0 20px}
.v9 .rates{border-top:1px solid rgba(255,255,255,.12);padding-top:16px;margin-bottom:24px}
.v9 .rate{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-dim);margin:6px 0}.v9 .rate b{color:#fff}
.v9 .value{background:var(--panel);padding:42px 40px}
.v9 .vh{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-faint);margin:0 0 22px;font-weight:700}
.v9 li{list-style:none;display:flex;gap:13px;align-items:flex-start;margin:0 0 18px;font-size:13.5px;color:var(--ink-dim);line-height:1.5}
.v9 li b{display:block;color:#fff;font-weight:700;margin-bottom:1px}
.v9 ul{margin:0;padding:0}

/* ===== V10 · Registration bar ===== */
.v10{max-width:1000px;margin:0 auto;background:var(--panel);border:1px solid var(--line-2);border-radius:16px;padding:30px 34px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:38px}
.v10 .price{text-align:center;border-right:1px solid var(--line);padding-right:34px}
.v10 .big{font-family:"Poppins";font-weight:800;font-size:56px;line-height:1;color:var(--accent-2);letter-spacing:-1.5px}
.v10 .big sup{font-size:24px;vertical-align:super}
.v10 .psub{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-faint);margin-top:8px}
.v10 .rate{font-size:11.5px;color:var(--ink-dim);margin-top:6px}.v10 .rate b{color:#fff}
.v10 .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px}
.v10 .cell{display:flex;gap:10px;align-items:center;font-size:13.5px;color:#fff;font-weight:600}
.v10 .cell .chk{width:19px;height:19px}
.v10 .cta{white-space:nowrap;padding:16px 30px}

/* ===== V11 · Price hero ===== */
.v11{max-width:820px;margin:0 auto;text-align:center}
.v11 .pname{font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent-2);font-weight:700;margin-bottom:6px}
.v11 .big{font-family:"Poppins";font-weight:900;font-size:150px;line-height:.85;letter-spacing:-6px;background:linear-gradient(180deg,#fff 30%,#5fd0e6);-webkit-background-clip:text;background-clip:text;color:transparent}
.v11 .big sup{font-size:52px;vertical-align:super;-webkit-text-fill-color:var(--accent-2)}
.v11 .psub{font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink-faint);margin:14px 0 6px}
.v11 .rates{font-size:13.5px;color:var(--ink-dim);margin-bottom:30px}.v11 .rates b{color:#fff}
.v11 .feats{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 12px;margin-bottom:30px}
.v11 .pill{display:flex;gap:9px;align-items:center;background:var(--panel);border:1px solid var(--line-2);border-radius:999px;padding:10px 18px;font-size:13px;color:#fff;font-weight:600}
.v11 .pill .chk{width:18px;height:18px}
.v11 .cta{padding:16px 40px;font-size:15px}

/* ===== V12 · Quiet premium ===== */
.v12{max-width:480px;margin:0 auto;background:linear-gradient(180deg,#101a2e,#0c1424);border:1px solid var(--line);border-radius:20px;padding:48px 46px;text-align:center}
.v12 .pname{font-size:11.5px;letter-spacing:3px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:20px}
.v12 .big{font-family:"Poppins";font-weight:800;font-size:60px;line-height:1;color:#fff;letter-spacing:-2px;display:inline-block;position:relative}
.v12 .big sup{font-size:26px;vertical-align:super;color:var(--ink-dim)}
.v12 .big::after{content:"";position:absolute;left:22%;right:22%;bottom:-12px;height:3px;border-radius:3px;background:var(--accent-2)}
.v12 .psub{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-faint);margin:26px 0 4px}
.v12 .rates{font-size:13px;color:var(--ink-dim);margin-bottom:28px}.v12 .rates b{color:#fff}
.v12 .divider{height:1px;background:var(--line);margin:0 0 24px}
.v12 li{list-style:none;display:flex;gap:12px;align-items:center;justify-content:flex-start;text-align:left;margin:0 0 14px;font-size:14px;color:#e6ecf7;font-weight:500}
.v12 li .tik{color:var(--accent-2);font-weight:800;font-size:14px}
.v12 ul{margin:0 0 30px;padding:0;display:inline-block}
.v12 .cta{padding:15px 40px}

/* ===== V13 · Track-color card ===== */
.v13{max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line-2);border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.v13 .bar{height:4px;background:linear-gradient(90deg,var(--t-post),var(--t-ai),var(--t-craft),var(--t-creator),var(--t-immersive))}
.v13 .pad{padding:38px 40px}
.v13 .pname{font-weight:800;font-size:18px;text-align:center;margin:0 0 6px}
.v13 .big{font-family:"Poppins";font-weight:800;font-size:54px;line-height:1;color:var(--accent-2);text-align:center;letter-spacing:-1.5px;margin:6px 0 2px}
.v13 .big sup{font-size:24px;vertical-align:super}
.v13 .psub{font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-faint);text-align:center;margin-bottom:16px}
.v13 .rates{display:flex;justify-content:center;gap:20px;font-size:13px;color:var(--ink-dim);margin-bottom:26px}.v13 .rates b{color:#fff}
.v13 li{list-style:none;display:flex;gap:13px;align-items:flex-start;margin:0 0 16px;font-size:13.5px;color:var(--ink-dim);line-height:1.5}
.v13 li .tchk{flex:none;width:22px;height:22px;border-radius:50%;background:var(--tc);color:#0a0e17;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.v13 li b{display:block;color:#fff;font-weight:700;margin-bottom:1px}
.v13 ul{margin:0 0 26px;padding:0}

.pagehead{max-width:1040px;margin:0 auto;padding:40px 30px 6px}
.pagehead h1{font-size:23px;font-weight:800;margin:0 0 6px}
.pagehead p{color:var(--ink-dim);font-size:14.5px;margin:0;max-width:760px;line-height:1.6}
.pagehead b{color:var(--accent-2)}
</style></head>
<body>
<div class="pagehead"><h1>“One pass. Full access.” — 6 more (V8–V13)</h1>
<p>Refined round, same real Poppins + tokens. Mix-and-match still welcome.</p></div>
<div id="root"></div>
<script>
const C={price:'799',
 rates:[['NAB members & Government','749'],['Students','399']],
 feats:[['Complete program access','The full P|PW New York program, no add-ons required.'],
        ['All seven workshop tracks','Editing, AI &amp; Emerging Tech, Color &amp; Motion, Audio, Photography &amp; Video, VR/Immersive, and Business &amp; Career.'],
        ['NAB Show New York floor access','Included with your registration.'],
        ['Networking events and the P|PW Party','Included with every full pass.']],
 shorts:['Full program access','All seven workshop tracks','NAB Show NY floor access','Networking + the P|PW Party'],
 cta:'Register at NAB Show'};
const P=`<sup>$</sup>${C.price}`;
const feLi=()=>C.feats.map(f=>`<li><span class="chk">✓</span><span><b>${f[0]}</b>${f[1]}</span></li>`).join('');
const head=`<div class="shead"><div class="eyebrow">Registration</div><h2 class="stitle">One pass. Full access.</h2><p class="sdesc">A single full-access pass gets you into every session, every workshop, and every room across both conference days. Discounted rates apply for NAB members, government, and students.</p></div>`;
const tcols=['var(--t-post)','var(--t-ai)','var(--t-craft)','var(--t-immersive)'];

const V={
 8:`<div class="v8"><div class="bar"></div><div class="in"><span class="notch" style="top:-11px"></span><span class="notch" style="bottom:-11px"></span>
     <div class="stub"><div class="rail">Full Access</div><div class="big">${P}</div><div class="psub">per person · both days</div>
       <div class="rate">NAB &amp; Gov <b>$749</b></div><div class="rate">Students <b>$399</b></div></div>
     <div class="body"><div class="pname">Everything included</div><ul>${feLi()}</ul><a class="cta full">${C.cta}</a></div></div></div>`,

 9:`<div class="v9"><div class="buy"><div class="pname">Full Conference Pass</div><div class="big">${P}</div><div class="psub">per person · both days</div>
      <div class="rates">${C.rates.map(r=>`<div class="rate"><span>${r[0]}</span><b>$${r[1]}</b></div>`).join('')}</div><a class="cta full">${C.cta}</a></div>
    <div class="value"><div class="vh">What's included</div><ul>${feLi()}</ul></div></div>`,

 10:`<div class="v10"><div class="price"><div class="big">${P}</div><div class="psub">per person · both days</div><div class="rate">NAB $749 · Students $399</div></div>
     <div class="grid">${C.shorts.map(s=>`<div class="cell"><span class="chk">✓</span>${s}</div>`).join('')}</div>
     <a class="cta">${C.cta}</a></div>`,

 11:`<div class="v11"><div class="pname">P|PW Full Conference Pass</div><div class="big">${P}</div>
      <div class="psub">Standard rate · per person · both days</div><div class="rates">NAB &amp; Gov <b>$749</b> &nbsp;·&nbsp; Students <b>$399</b></div>
      <div class="feats">${C.shorts.map(s=>`<span class="pill"><span class="chk">✓</span>${s}</span>`).join('')}</div>
      <a class="cta">${C.cta}</a></div>`,

 12:`<div class="v12"><div class="pname">Full Conference Pass</div><div class="big">${P}</div>
      <div class="psub">per person · both days</div><div class="rates">NAB &amp; Gov <b>$749</b> · Students <b>$399</b></div>
      <div class="divider"></div><ul>${C.shorts.map(s=>`<li><span class="tik">✓</span>${s}</li>`).join('')}</ul>
      <a class="cta full">${C.cta}</a></div>`,

 13:`<div class="v13"><div class="bar"></div><div class="pad"><div class="pname">P|PW Full Conference Pass</div><div class="big">${P}</div>
      <div class="psub">Standard rate · per person · both days</div>
      <div class="rates"><span>NAB &amp; Gov <b>$749</b></span><span>Students <b>$399</b></span></div>
      <ul>${C.feats.map((f,i)=>`<li><span class="tchk" style="--tc:${tcols[i]}">✓</span><span><b>${f[0]}</b>${f[1]}</span></li>`).join('')}</ul>
      <a class="cta full">${C.cta}</a></div></div>`
};
const names={8:'Boarding pass II',9:'Spotlight split',10:'Registration bar',11:'Price hero',12:'Quiet premium',13:'Track-color card'};
const only=new URLSearchParams(location.search).get('only');
let html='';
for(let i=8;i<=13;i++){if(only&&String(i)!==only)continue;html+=`<section class="psec"><div class="wrap"><div class="vlabel"><span class="n">V${i}</span><span class="nm">${names[i]}</span></div>${head}${V[i]}</div></section>`;}
document.getElementById('root').innerHTML=html;
if(only){document.querySelector('.pagehead').style.display='none';}
</script>
</body></html>
