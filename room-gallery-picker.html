<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room-you-reach gallery — pick your favorites</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080b12;--cyan:#87dffa;--line:rgba(255,255,255,.12)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#eef2fb;font-family:"Poppins",sans-serif}
  .top{max-width:1180px;margin:0 auto;padding:40px 22px 6px}
  h1{font-size:24px;font-weight:800;margin:0 0 8px}
  .top p{color:#8493b3;font-size:14px;margin:0;line-height:1.6}
  .top b{color:var(--cyan)}
  .grid{max-width:1180px;margin:24px auto 0;padding:0 22px 90px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
  .card{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0d1424}
  .card.top5{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 12px 30px rgba(135,223,250,.16)}
  .card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
  .meta{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;font-size:12.5px;color:#aeb9d4}
  .fn{font-weight:600;color:#dbe3f4}
  .badge{position:absolute;top:10px;left:10px;background:var(--cyan);color:#04121a;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:4px 9px;border-radius:8px}
  .rank{color:var(--cyan);font-weight:800}
</style>
</head>
<head></head>
<body>
<div class="top">
  <h1>"The room you reach" — pick your favorites</h1>
  <p>16 session / audience options. The <b>5 cyan-bordered</b> are my top picks (badged 1–5). Reply with the filenames you want (usually 1 big + 4 smaller), or say "use your 5" and I'll place them.</p>
</div>
<div class="grid" id="root"></div>
<script>
const TOP={'conf-a.webp':1,'aud-crowd.webp':2,'conf-g4.jpg':3,'lab-106.webp':4,'conf-g3.jpg':5};
const FILES=['aud-crowd.webp','conf-a.webp','conf-b.webp','conf-c.webp','conf-d.webp','conf-g1.jpg','conf-g2.jpg','conf-g3.jpg','conf-g4.jpg','conf-g5.jpg','g-classroom.jpg','lab-101.webp','lab-103.webp','lab-105.webp','lab-106.webp','lab-107.webp'];
document.getElementById('root').innerHTML=FILES.map(f=>{
  const t=TOP[f];
  return `<div class="card ${t?'top5':''}">${t?`<span class="badge">Top pick #${t}</span>`:''}
    <a href="ppw-assets/${f}" target="_blank"><img src="ppw-assets/${f}" loading="lazy" alt=""></a>
    <div class="meta"><span class="fn">${f}</span>${t?`<span class="rank">#${t}</span>`:'<span></span>'}</div></div>`;
}).join('');
</script>
</body>
</html>
