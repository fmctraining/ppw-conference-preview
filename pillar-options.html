<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option 1 · refined dividers — both icon sections</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080b12;--ink:#eef2fb;--dim:#cdd4ea;--faint:#8493b3;
    --line:rgba(255,255,255,.13);
    --grad-blue:linear-gradient(100deg in oklch,oklch(86% .10 225),oklch(80% .12 288));
    --cyan:#87dffa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Poppins",sans-serif;line-height:1.5}
  .banner{background:#0b1120;border-bottom:1px solid rgba(255,255,255,.1);padding:16px 22px;text-align:center;color:#9fb0d4;font-size:13.5px;position:sticky;top:0;z-index:30}
  .banner b{color:var(--cyan)}
  .sec{position:relative;padding:78px 22px 84px;border-bottom:1px solid rgba(255,255,255,.06)}
  .lbl{position:absolute;top:16px;left:16px;z-index:5;background:var(--cyan);color:#04121a;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.4px;padding:6px 14px;border-radius:10px}
  .wrap{max-width:1040px;margin:0 auto}
  .sec-head{text-align:center;margin-bottom:46px}
  .sec-kicker{display:inline-block;background:var(--grad-blue);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:14.5px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700}
  .sec-title{font-size:clamp(27px,3.8vw,40px);margin-top:22px;font-weight:700;letter-spacing:-.8px;line-height:1.24;background:linear-gradient(180deg,#fff,#c9d5ee);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* Option 1 — refined dividers */
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
  .pillar{padding:0 18px}
  .pillar+.pillar{border-left:1px solid var(--line)}
  .ico{width:64px;height:64px;margin:0 auto 18px;filter:drop-shadow(0 6px 18px rgba(90,150,240,.28))}
  .pic{width:100%;height:100%}
  .pillar h3{color:#fff;font-weight:600;font-size:21px;line-height:1.3;letter-spacing:-.2px;margin:0 auto 10px}
  .pillar h3 b{display:block;background:var(--grad-blue);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
  .pillar p{color:var(--dim);margin:0;font-size:14.8px;line-height:1.6}

  @media(max-width:760px){
    .pillars{grid-template-columns:1fr;gap:36px}
    .pillar{padding:0}
    .pillar+.pillar{border-left:0}
  }
</style>
</head>
<body>
<div class="banner">Option 1 · refined dividers — blue phrase now sits on line 2 of every header. Shown on <b>both</b> icon sections of the sponsor page.</div>

<!-- shared blue-gradient + icon symbols -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd6f5"/><stop offset="1" stop-color="#8ea8f0"/>
    </linearGradient>
  </defs>
  <symbol id="ic-star" viewBox="0 0 24 24"><path fill="url(#bg)" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></symbol>
  <symbol id="ic-cap" viewBox="0 0 24 24"><path fill="url(#bg)" d="M12 3 1 9l11 6 9-4.91V17h2V9L12 3zm-6.82 6L12 12.72 18.82 9 12 5.28 5.18 9zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></symbol>
  <symbol id="ic-mega" viewBox="0 0 24 24"><path fill="url(#bg)" d="M18 11v2h4v-2h-4zm-1.5 6.6c.71.53 1.63 1.24 2.4 1.85l1.2-1.6c-.77-.61-1.69-1.32-2.4-1.85l-1.2 1.6zm3.6-13.15c-.77.61-1.69 1.32-2.4 1.85l1.2 1.6c.77-.61 1.69-1.32 2.4-1.85l-1.2-1.6zM4 9c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h1v4h2v-4h1l5 3V6L8 9H4zm11.5 3c0-1.33-.58-2.53-1.5-3.35v6.69c.92-.81 1.5-2.01 1.5-3.34z"/></symbol>
  <symbol id="ic-pin" viewBox="0 0 24 24"><path fill="url(#bg)" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></symbol>
  <symbol id="ic-net" viewBox="0 0 24 24"><path fill="url(#bg)" d="M17 16l-4-4V8.82C14.16 8.4 15 7.3 15 6c0-1.66-1.34-3-3-3S9 4.34 9 6c0 1.3.84 2.4 2 2.82V12l-4 4H3v5h5v-3.05l4-4.2 4 4.2V21h5v-5h-4z"/></symbol>
  <symbol id="ic-brain" viewBox="0 0 24 24"><path fill="url(#bg)" d="M8.5 3A3.5 3.5 0 0 0 5 6.5c0 .3 0 .6.1.9A3.5 3.5 0 0 0 3 10.5c0 1 .4 1.9 1 2.5-.6.6-1 1.5-1 2.5A3.5 3.5 0 0 0 6.5 19c.3 0 .6 0 .9-.1A3.5 3.5 0 0 0 11 21V5a2 2 0 0 0-2-2zm7 0a2 2 0 0 0-2 2v16a3.5 3.5 0 0 0 3.6-2.1c.3.1.6.1.9.1a3.5 3.5 0 0 0 3.5-3.5c0-1-.4-1.9-1-2.5.6-.6 1-1.5 1-2.5a3.5 3.5 0 0 0-2.1-3.1c.1-.3.1-.6.1-.9A3.5 3.5 0 0 0 15.5 3z"/></symbol>
</svg>

<div id="root"></div>

<p style="max-width:1040px;margin:0 auto;padding:40px 22px 90px;color:#7c8bab;font-size:12.5px">Internal preview — pillar-options.html · Option 1. If this looks right, say "apply it" and I'll put it on both sections of the live sponsor page.</p>

<script>
const BRAND=[
 {ic:'ic-star', lead:'Establish', key:'Global Brand Leadership', d:'Gain unparalleled, year-round visibility and position your company as a recognized industry leader.'},
 {ic:'ic-cap',  lead:'Partner with', key:'World-Class Training', d:"Showcase your brand alongside top-tier instruction from FMC's Certified Instructors and presenters."},
 {ic:'ic-mega', lead:'Reach a', key:'Premium Creative Audience', d:'Promote your latest software and solutions to a highly targeted, engaged global demographic.'},
];
const AMP=[
 {ic:'ic-pin',   title:'Regional Campaigns', d:'Extensive local marketing driven by NAB Show in the U.S., MPTS in London, and Broadcast India in Asia, each engaging its own vibrant community.'},
 {ic:'ic-net',   title:'Integrated Marketing', d:'Global PR, social, and email campaigns powered by FMC amplify every regional effort with unified press, newsletters, and creative partnerships.'},
 {ic:'ic-brain', title:'Premium Engagement', d:'Year-round exposure, unified branding, AI-driven analytics, and direct engagement with decision-makers worldwide.'},
];
const svg=id=>`<svg class="pic"><use href="#${id}"/></svg>`;
const brandPillar=p=>`<div class="pillar"><div class="ico">${svg(p.ic)}</div><h3>${p.lead} <b>${p.key}</b></h3><p>${p.d}</p></div>`;
const ampPillar=p=>`<div class="pillar"><div class="ico">${svg(p.ic)}</div><h3>${p.title}</h3><p>${p.d}</p></div>`;

document.getElementById('root').innerHTML=`
  <section class="sec"><span class="lbl">Section 1</span><div class="wrap">
    <div class="sec-head"><div class="sec-kicker">Why Partner with PPW</div><h2 class="sec-title">A platform built for brand leaders</h2></div>
    <div class="pillars">${BRAND.map(brandPillar).join('')}</div>
  </div></section>
  <section class="sec"><span class="lbl">Section 2</span><div class="wrap">
    <div class="sec-head"><div class="sec-kicker">Marketing &amp; Audience Reach</div><h2 class="sec-title">Amplified across four continents</h2></div>
    <div class="pillars">${AMP.map(ampPillar).join('')}</div>
  </div></section>`;
</script>
</body>
</html>
