<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPW Vegas gallery — pick your favorites</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet"><style>
body{margin:0;background:#0a0e17;color:#eef2fb;font-family:"Poppins",-apple-system,sans-serif}
.bar{position:sticky;top:0;z-index:10;background:rgba(10,14,23,.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.1);padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bar h1{font-size:16px;margin:0;font-weight:800}.count{color:#87dffa;font-weight:800;font-size:14px}
.btn{background:#4f7df9;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:800;font-size:13px;cursor:pointer}
.btn.sec{background:transparent;border:1px solid rgba(255,255,255,.25)}
.intro{max-width:1180px;margin:0 auto;padding:20px 22px 0;color:#a9b7d6;font-size:14px;line-height:1.6}
.grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:16px 22px 60px}
.ph{position:relative;aspect-ratio:3/2;border-radius:10px;overflow:hidden;cursor:pointer;border:3px solid transparent;background:#111}
.ph img{width:100%;height:100%;object-fit:cover;opacity:.62;transition:opacity .15s}
.ph.yes{border-color:#5fd39a}.ph.yes img{opacity:1}
.ph .k{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:#5fd39a;color:#04120b;display:none;align-items:center;justify-content:center;font-weight:900;font-size:16px}
.ph.yes .k{display:flex}
dialog{background:#111a2c;color:#eef2fb;border:1px solid rgba(255,255,255,.15);border-radius:14px;max-width:620px;width:92%}
textarea{width:100%;height:220px;background:#0a0e17;color:#eef2fb;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:10px;font-family:monospace;font-size:12px;box-sizing:border-box}
</style></head><body>
<div class="bar"><h1>PPW Vegas — pick your favorites</h1><span class="count" id="c">0 selected</span>
<button class="btn" onclick="exp()">Copy my picks</button><button class="btn sec" onclick="clr()">Clear</button></div>
<div class="intro">Tap the photos you like for the "Inside P|PW" gallery (green check = picked). When you're done, hit <b>Copy my picks</b> and paste them back to Syvonne. Order doesn't matter — she'll arrange them. Auto-saves as you go.</div>
<div class="grid" id="g"></div>
<dialog id="d"><h3 style="margin:0 0 8px">Your picks (<span id="dn"></span>)</h3><textarea id="ta" readonly></textarea>
<div style="margin-top:10px;text-align:right"><button class="btn" onclick="navigator.clipboard.writeText(ta.value);this.textContent='Copied!'">Copy</button>
<button class="btn sec" onclick="d.close()">Close</button></div></dialog>
<script>
const FILES=["718A5491.jpg", "PPW2024_by_Syvonne_K_Photography_316.jpg", "718A6604.jpg", "PPW2024_by_Syvonne_K_Photography_623.jpg", "PPW1.jpg", "PPW2024_by_Syvonne_K_Photography_365.jpg", "PPW2024_by_Syvonne_K_Photography_358.jpg", "718A5934.jpg", "PPW2024_by_Syvonne_K_Photography_377.jpg", "718A6334.jpg", "PPW2024_by_Syvonne_K_Photography_549.jpg", "PPW2024_by_Syvonne_K_Photography_612.jpg", "PPW2024_by_Syvonne_K_Photography_144.jpg", "PPW2024_by_Syvonne_K_Photography_147.jpg", "PPW2024_by_Syvonne_K_Photography_237.jpg", "PPW2024_by_Syvonne_K_Photography_402.jpg", "PPW2024_by_Syvonne_K_Photography_395.jpg", "PPW2024_by_Syvonne_K_Photography_580.jpg", "718A5966.jpg", "718A6291.jpg", "PPW2024_by_Syvonne_K_Photography_324.jpg", "PPW2024_by_Syvonne_K_Photography_558.jpg", "PPW2024_by_Syvonne_K_Photography_551.jpg", "718A7006.jpg"];let sel=new Set(JSON.parse(localStorage.getItem('ppw_vegas_elise')||'[]'));
const g=document.getElementById('g'),ta=document.getElementById('ta'),d=document.getElementById('d');
FILES.forEach(f=>{const e=document.createElement('div');e.className='ph'+(sel.has(f)?' yes':'');
 e.innerHTML='<img loading="lazy" src="ppw-assets/gallery-vegas/'+encodeURIComponent(f)+'"><div class="k">&#10003;</div>';
 e.onclick=()=>{sel.has(f)?(sel.delete(f),e.classList.remove('yes')):(sel.add(f),e.classList.add('yes'));save()};g.appendChild(e)});
function save(){localStorage.setItem('ppw_vegas_elise',JSON.stringify([...sel]));document.getElementById('c').textContent=sel.size+' selected'}
function exp(){ta.value=[...sel].join('\n');document.getElementById('dn').textContent=sel.size;d.showModal()}
function clr(){if(confirm('Clear all?')){sel.clear();save();document.querySelectorAll('.ph.yes').forEach(x=>x.classList.remove('yes'))}}
save();
</script></body></html>
